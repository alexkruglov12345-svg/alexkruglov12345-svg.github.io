<body>
<div class="shell">

    <section class="game" id="game"><div class="game-top"><span class="tag" id="tag">полная версия</span><h1 id="title">Самая простая игра</h1><p id="subtitle">Старые задания вернулись. Новые уже ждут.</p></div><div id="arena"></div></section>
    <aside class="person-panel"><div class="person-head"><span>наблюдение за игроком</span><span class="live"><i></i> live</span></div><div class="room"><div class="human" id="human"><div class="steam a"></div><div class="steam b"></div><div class="arm l"><i class="fist"></i></div><div class="arm r"><i class="fist"></i></div><div class="body"></div><div class="neck"></div><div class="head"><div class="ear"></div><div class="hair"></div><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div></div><div class="desk"></div></div><div class="status"><div class="mood-row"><span>злость человека</span><span id="rageValue">0%</span></div><div class="rage-track"><div class="rage-fill" id="rageFill"></div></div><button class="rage-confess" id="rageButton">Я БЕШУСЬ</button></div></aside>

</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="time-event" id="timeEvent"><div><b>22:22</b><span>ИГРА СМОТРИТ В ОТВЕТ</span></div></div>
<script>
(()=>{
 const $=s=>document.querySelector(s), arena=$('#arena'),title=$('#title'),subtitle=$('#subtitle'),tag=$('#tag'),game=$('#game'),human=$('#human');
 const rageFill=$('#rageFill'),rageValue=$('#rageValue'),steps=$('#steps'),modal=$('#modal'),modalCard=$('#modalCard');
 let stage=-1,rage=0,pranks=0,misclicks=0,rageClicks=0,sound=true,started=0,stageStarted=0,timers=[],traits={haste:0,caution:0,repeats:0,defiance:0},lastAction='',achievements=new Set(),timeEventShown=false;
 const total=72;
 const later=(fn,ms)=>{let id=setTimeout(fn,ms);timers.push(id);return id}, every=(fn,ms)=>{let id=setInterval(fn,ms);timers.push(id);return id}, clearTimers=()=>{timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[]};

 function screen(t,s,label='система'){const titles={'Курсор-предатель':'Проверка курсора'};const subtitles={'Она совершенно не убегает.':'Нажми кнопку.','Дождись 100%. Это почти честное задание.':'Дождись завершения процесса.','Подожди пять секунд. Красная кнопка — ловушка.':'Подожди пять секунд.','Правильный ответ очень скромный и избегает внимания.':'Выбери правильный ответ.','Четыре секунды. Прогрессу доверять необязательно.':'Удерживай кнопку четыре секунды.','Последняя кнопка старой части. Вроде бы.':'Нажми кнопку финиша.','Зелёная кнопка специально подписана максимально понятно.':'Следуй инструкции на экране.','Поймай синюю цель. Видимый курсор врёт о своём положении.':'Поймай синюю цель.','Выбери любую. После выбора правильной станет другая.':'Выбери одну из двух дверей.','На этот раз правда. Можно расслабиться.':'Прохождение завершено.'};title.textContent=titles[t]||t;subtitle.textContent=subtitles[s]||s;let cleanLabel=['старое задание','абсолютно ясная инструкция','правила изменены'].includes(label)?'задание':label;tag.textContent=stage>=0?cleanLabel+' · '+(stage+1)+' ИЗ '+total:cleanLabel;arena.className='';arena.innerHTML='';stageStarted=performance.now();updateSteps()}

 function win(secret){let secs=Math.max(1,Math.round((Date.now()-started)/1000));if(secret){human.className='human furious';achieve('Игра выбесилась вместо тебя')}else human.className='human annoyed';modalCard.innerHTML=`<span class="tag">${secret?'секретная концовка':'сеанс завершён'}</span><h2>${secret?'Игра бесится!':'Ты победил!'}</h2><p>${secret?'Ты ни разу не воспользовался кнопкой ярости. Человек спокоен, зато сама игра окончательно вышла из себя.':'Человек-наблюдатель пережил игру. Стол — не очень.'}</p><div class="stats"><div class="stat"><b>${rage}%</b><small>злости</small></div><div class="stat"><b>${pranks}</b><small>пранков</small></div><div class="stat"><b>${secs}с</b><small>времени</small></div></div><button class="btn" id="again">СНОВА. СЕРЬЁЗНО?</button>`;modal.classList.add('show');$('#again').onclick=()=>{modal.classList.remove('show');stage=-1;rage=0;pranks=0;rageClicks=0;started=0;traits={haste:0,caution:0,repeats:0,defiance:0};achievements.clear();rageFill.style.width='0';rageValue.textContent='0%';human.className='human';render()}}
 function checkTime(){let d=new Date(),text=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('#clock').textContent=text;if(text==='22:22'&&!timeEventShown){timeEventShown=true;$('#timeEvent').classList.add('show');anger(12,'22:22. Игра заметила, что ты тоже смотришь.');achieve('Увидел 22:22');setTimeout(()=>$('#timeEvent').classList.remove('show'),2222)}}
 function adaptDevice(){let w=innerWidth,device=w<600?'phone':w<1100?'tablet':w<1500?'laptop':'desktop';document.documentElement.dataset.device=device;document.documentElement.dataset.input=matchMedia('(pointer:coarse)').matches?'touch':'pointer'}
 $('#soundBtn').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♫':'×';if(sound)beep(440,.08)};
 $('#rageButton').onclick=()=>{rageClicks++;traits.defiance++;anger(10,rageClicks===1?'Человек признался. Игра записала признание.':'Человек снова нажал кнопку ярости. Стол напрягся.');achieve(rageClicks===1?'Официально выбесился':'Нажал кнопку ярости снова')};
 arena.addEventListener('wheel',e=>{if(!arena.classList.contains('support-scroll'))return;e.preventDefault();let delta=e.deltaY;if(!delta&&e.wheelDelta)delta=-e.wheelDelta;arena.scrollTop+=delta>0?Math.max(70,delta):Math.min(-70,delta)},{passive:false});
 addEventListener('resize',adaptDevice,{passive:true});adaptDevice();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});setInterval(checkTime,1000);checkTime();render();
})();
</script>
