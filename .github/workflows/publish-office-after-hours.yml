name: Publish Office After Hours

on:
  push:
    branches: [main]
    paths:
      - '.game-release-parts/**'
      - '.github/workflows/publish-office-after-hours.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Windows archive
        shell: bash
        run: |
          cat .game-release-parts/part-*.bin > OfficeAfterHours-Windows-2026-11-25.zip
          echo "A03A35B4914065978F6748F651A271146055AF3CFC1F00E6FA3CB1EE265CF7A0  OfficeAfterHours-Windows-2026-11-25.zip" | sha256sum --check --strict
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create office-after-hours-2026-11-25 OfficeAfterHours-Windows-2026-11-25.zip --title "Office After Hours — смены 1–6" --notes "Свежая Windows-версия. Распакуйте архив и запустите ИГРАТЬ.bat. В Бэкрумсе монстр появляется примерно в трёх метрах позади игрока, а на экране отображается предупреждение «БЕГИТЕ!»."
